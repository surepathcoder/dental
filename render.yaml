# Render blueprint: FastAPI backend + PostgreSQL.
# The Next.js frontend is deployed separately on Vercel (see docs/DEPLOYMENT.md).
services:
  - type: web
    name: brightsmile-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEMO_MODE
        value: "true"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: brightsmile-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-frontend.vercel.app
      - key: PUBLIC_SITE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: CAL_API_KEY
        sync: false
      - key: CAL_EVENT_TYPE_ID
        sync: false

databases:
  - name: brightsmile-db
    plan: free
    databaseName: brightsmile
    user: brightsmile
